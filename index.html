<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaBo - Obtainium Repository</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #1e88e5;
            --primary-hover: #1565c0;
            --text-main: #f0f0f0;
            --text-sub: #a0a0a0;
            --success: #00e676;
            --border: #333333;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .badge {
            display: inline-block;
            background: rgba(0, 230, 118, 0.15);
            color: var(--success);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }
        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin: 0 0 24px 0;
            line-height: 1.4;
        }
        .btn-download {
            display: block;
            background: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            transition: background 0.2s ease;
            box-shadow: 0 4px 14px rgba(30, 136, 229, 0.4);
        }
        .btn-download:hover {
            background: var(--primary-hover);
        }
        .details-table {
            width: 100%;
            margin-top: 28px;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }
        .details-table td {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        .details-table td:first-child {
            color: var(--text-sub);
            width: 40%;
        }
        .details-table td:last-child {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }
        .obtainium-instructions {
            margin-top: 24px;
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 14px;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text-sub);
        }
        .obtainium-instructions strong {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Latest Release: v1.0.0</span>
        <h1>NaBo</h1>
        <p class="subtitle">Audio-triggered assistive touch automation</p>

        <!-- Direct APK link for browser & Obtainium scraping -->
        <a id="apk-download" class="btn-download" href="nabo.apk" download="nabo.apk">
            Download NaBo APK
        </a>

        <table class="details-table">
            <tr>
                <td>Version</td>
                <td id="version-tag">1.0.0</td>
            </tr>
            <tr>
                <td>Package Name</td>
                <td>com.notabot.nabo</td>
            </tr>
            <tr>
                <td>Version Code</td>
                <td>1</td>
            </tr>
            <tr>
                <td>Min Android</td>
                <td>7.0 (API 24)</td>
            </tr>
        </table>

        <div class="obtainium-instructions">
            <strong>Obtainium Setup:</strong><br>
            1. Tap <em>Add App</em> (+) in Obtainium.<br>
            2. Enter URL: <code>http://192.168.68.50:8080/nabo.apk</code><br>
            3. Tap <em>Add</em> to install.
        </div>
    </div>
</body>
</html>
